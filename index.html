<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ấn triện chu sa khắc chữ 道 - nhận diện của app -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Cài lên màn hình chính, và mở được khi mất mạng. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Đạo Trình" />

    <title>Đạo Trình · Kế hoạch & tu luyện</title>
    <meta
      name="description"
      content="Đạo Trình - lập kế hoạch theo ngày, tuần, tháng và biến việc hoàn thành thành tu vi, đi từ Luyện Khí tới Phi Thăng."
    />
    <meta name="theme-color" content="#0d0a08" />

    <!--
      Ảnh chia sẻ link. og:image nên là URL tuyệt đối vì nhiều nơi bóc link
      không hiểu đường dẫn tương đối - khi có tên miền thật thì đổi thành
      https://<tên-miền>/og.jpg. Ảnh này do scripts/make-og.mjs dựng.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Đạo Trình · Kế hoạch & tu luyện" />
    <meta
      property="og:description"
      content="Mỗi việc hoàn thành là một phần tu vi - đi từ Luyện Khí tới Phi Thăng."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Đạo Trình · Kế hoạch & tu luyện" />
    <meta
      name="twitter:description"
      content="Mỗi việc hoàn thành là một phần tu vi - đi từ Luyện Khí tới Phi Thăng."
    />
    <meta name="twitter:image" content="/og.jpg" />
    <style>
      /* Màn hình chờ - phải nội tuyến, tách ra tệp riêng thì lại thêm một lượt
         chờ mạng, đúng thứ đang cần tránh. */
      .man-cho {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.9rem;
        justify-items: center;
        background: #0d0a08;
        color: #cbb994;
        font-family: system-ui, sans-serif;
      }
      .man-cho-an {
        width: 4.5rem;
        height: 4.5rem;
        display: grid;
        place-content: center;
        border: 1px solid #cbb99455;
        border-radius: 0.75rem;
        font-size: 2.25rem;
        line-height: 1;
        color: #e0a83c;
        background: radial-gradient(120% 120% at 50% 0%, #e0a83c22, transparent);
        animation: man-cho-tho 2.4s ease-in-out infinite;
      }
      .man-cho-chu {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        opacity: 0.75;
      }
      @keyframes man-cho-tho {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .man-cho-an { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Màn hình chờ tĩnh.

        Trước đây chỗ này là một thẻ div rỗng, nên từ lúc bấm vào link tới lúc
        React dựng xong là màn hình TRẮNG - đo được 6,2 giây ở lần mở đầu. Vài
        dòng HTML ở đây hiện ngay khi tài liệu về tới, trước cả khi JS tải.

        React thay sạch phần bên trong `#root` lúc gắn vào, nên không phải dọn.
      -->
      <div class="man-cho" aria-hidden="true">
        <div class="man-cho-an">道</div>
        <p class="man-cho-chu">Đang mở sơn môn…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Đăng ký service worker.
       *
       * Đợi `load` rồi mới đăng ký: lần mở ĐẦU tiên mà chen vào thì nó tranh
       * băng thông với chính mấy tệp đang cần để vẽ trang.
       *
       * Nuốt lỗi có chủ ý - chạy qua http:// hoặc trong tab ẩn danh là trình
       * duyệt từ chối, mà đó không phải lý do để app không mở được.
       */
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          /*
           * Tự chữa khi máy còn giữ worker cũ.
           *
           * `register` một mình là chưa đủ: trình duyệt chỉ đi hỏi lại `sw.js`
           * theo nhịp của nó, nên một máy đã cài bản cũ có thể chạy bản ấy
           * thêm nhiều lần mở nữa - kèm theo mọi lỗi đã sửa xong từ lâu. Đó
           * đúng là chuyện vừa xảy ra với lỗi video độ kiếp: bản vá đã lên
           * máy chủ mà máy người dùng vẫn chạy bản hỏng.
           *
           * `update()` ép hỏi ngay. Khi worker mới nắm quyền thì tải lại MỘT
           * lần để trang đang mở dùng đúng bộ tệp của nó - có cờ chặn để không
           * bao giờ thành vòng lặp tải lại.
           */
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => reg.update())
            .catch(() => {});

          // Lần cài đầu tiên thì chưa có ai nắm quyền - đổi quyền lúc ấy là
          // chuyện bình thường, không phải thay bản, nên không tải lại.
          const daCoWorker = !!navigator.serviceWorker.controller;
          let daTaiLai = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!daCoWorker || daTaiLai) return;
            daTaiLai = true;
            location.reload();
          });

          /*
           * Nói cho worker biết trang này đang dùng những tệp nào.
           *
           * Không có bước này thì lần mở đầu tiên chẳng có gì vào kho (worker
           * nắm quyền sau khi tệp đã tải xong), và mất mạng là trắng màn hình.
           */
          navigator.serviceWorker.ready.then((reg) => {
            /*
             * Lấy danh sách từ Performance API, KHÔNG phải từ thẻ <script>.
             *
             * Phần lớn mã nằm trong chunk nạp động (primitives, Scene3D, từng
             * màn hình) - chúng không có thẻ nào trong HTML, nên quét DOM chỉ
             * thấy đúng tệp vào. Thiếu chúng thì mất mạng vẫn trắng màn hình:
             * HTML có, tệp vào có, nhưng nó lại đi tìm chunk không có trong kho.
             *
             * Gửi hai lần: lần đầu ngay khi tải xong, lần sau chờ mấy chunk
             * nạp muộn (lớp cảnh 3D, màn hình mở sau).
             */
            const gui = () => {
              const urls = performance
                .getEntriesByType('resource')
                .map((r) => r.name)
                .filter((u) => {
                  if (new URL(u).origin !== location.origin) return false;
                  return /\.(js|css|woff2?)(\?|$)/.test(new URL(u).pathname);
                });
              (reg.active ?? navigator.serviceWorker.controller)?.postMessage({
                kieu: 'uom-kho',
                urls,
              });
            };
            gui();
            setTimeout(gui, 6000);
          });
        });
      }
    </script>
  </body>
</html>
